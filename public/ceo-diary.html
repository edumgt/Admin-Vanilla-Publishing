<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO 다이어리 — AI·반도체 리더 동향</title>
    <link href="assets/css/default.css" rel="stylesheet">
    <style>
        /* ── CEO 셀렉터 카드 ── */
        .ceo-card {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: #fff;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }
        .ceo-card:hover  { border-color: #0058a3; background: #f0f7ff; }
        .ceo-card.active { border-color: #0058a3; background: #ebf4ff; }
        .ceo-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }

        /* ── 다이어리 타임라인 ── */
        #diary-timeline { position: relative; }
        #diary-timeline::before {
            content: '';
            position: absolute; left: 88px; top: 0; bottom: 0;
            width: 2px; background: linear-gradient(to bottom, #0058a3 0%, #c3dafe 100%);
            border-radius: 2px;
        }
        .diary-entry {
            display: flex; gap: 18px; margin-bottom: 28px; position: relative;
        }
        .diary-date-col {
            width: 78px; text-align: right; flex-shrink: 0; padding-top: 4px;
        }
        .diary-date-day   { font-size: 1.6rem; font-weight: 800; color: #2d3748; line-height: 1; }
        .diary-date-month { font-size: 0.7rem; color: #718096; font-weight: 600; }
        .diary-date-year  { font-size: 0.65rem; color: #a0aec0; }
        .diary-dot {
            width: 14px; height: 14px; border-radius: 50%; border: 3px solid #0058a3;
            background: #fff; flex-shrink: 0; margin-top: 6px;
            position: relative; z-index: 1;
        }
        .diary-card {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,.09);
            padding: 16px 18px;
            border-left: 4px solid #0058a3;
            transition: box-shadow .15s;
        }
        .diary-card:hover { box-shadow: 0 4px 18px rgba(0,88,163,.18); }
        .diary-card.activity-실적발표  { border-color: #e53e3e; }
        .diary-card.activity-기조연설  { border-color: #d69e2e; }
        .diary-card.activity-서밋      { border-color: #805ad5; }
        .diary-card.activity-컨퍼런스  { border-color: #319795; }
        .diary-card.activity-의회증언  { border-color: #2b6cb0; }
        .diary-card.activity-투자발표  { border-color: #276749; }
        .diary-card.activity-파트너십  { border-color: #b7791f; }
        .diary-card.activity-신제품발표 { border-color: #c53030; }
        .diary-card.activity-미팅      { border-color: #4a5568; }
        .diary-card.activity-방문      { border-color: #dd6b20; }
        .diary-card.activity-기고      { border-color: #6b46c1; }

        .activity-badge {
            display: inline-block; font-size: 0.68rem; font-weight: 700;
            padding: 2px 8px; border-radius: 10px; margin-right: 6px;
        }
        .ab-실적발표  { background: #fff5f5; color: #c53030; }
        .ab-기조연설  { background: #fffff0; color: #b7791f; }
        .ab-서밋      { background: #faf5ff; color: #6b46c1; }
        .ab-컨퍼런스  { background: #e6fffa; color: #285e61; }
        .ab-의회증언  { background: #ebf8ff; color: #2c5282; }
        .ab-투자발표  { background: #f0fff4; color: #276749; }
        .ab-파트너십  { background: #fffbeb; color: #92400e; }
        .ab-신제품발표 { background: #fff5f5; color: #c53030; }
        .ab-미팅      { background: #f7fafc; color: #4a5568; }
        .ab-방문      { background: #fff8f0; color: #c05621; }
        .ab-기고      { background: #f5f3ff; color: #6b21a8; }
        .ab-기타      { background: #f7fafc; color: #718096; }

        /* ── 국가 플래그 칩 ── */
        .country-chip {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.7rem; font-weight: 600;
            padding: 2px 8px; border-radius: 10px;
            background: #edf2f7; color: #4a5568;
        }
        .country-chip .flag { font-size: 1rem; }

        /* ── 방문국 히트맵 ── */
        .visit-country-bar {
            display: flex; align-items: center; gap: 8px; padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .visit-country-bar:last-child { border-bottom: none; }
        .visit-bar-fill {
            height: 8px; border-radius: 4px;
            background: linear-gradient(90deg, #0058a3, #63b3ed);
        }

        /* ── 검색 ── */
        #diary-search {
            border: 1px solid #cbd5e0; border-radius: 8px;
            padding: 7px 12px 7px 34px; font-size: 0.82rem;
            width: 240px; outline: none;
        }
        #diary-search:focus { border-color: #0058a3; }
        .search-wrap { position: relative; }
        .search-wrap i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#a0aec0; font-size:.85rem; }

        /* ── 로딩 ── */
        #loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; gap: 14px;
        }
        .spinner {
            width: 42px; height: 42px;
            border: 4px solid #e2e8f0;
            border-top-color: #0058a3;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── 소스 링크 ── */
        .source-tag { font-size: 0.68rem; color: #a0aec0; }
        .diary-title { font-size: 0.95rem; font-weight: 700; color: #2d3748; line-height: 1.4; margin-bottom: 6px; }
        .diary-summary { font-size: 0.82rem; color: #4a5568; line-height: 1.6; }

        /* ── 필터 탭 ── */
        .filter-tab {
            padding: 3px 12px; border-radius: 16px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; border: 1px solid #cbd5e0; background: #fff; color: #4a5568;
            transition: all .12s;
        }
        .filter-tab.active, .filter-tab:hover { background: #0058a3; color: #fff; border-color: #0058a3; }

        /* ── 프로필 헤더 ── */
        #ceo-profile-header {
            background: linear-gradient(135deg, #0058a3 0%, #2b6cb0 60%, #4299e1 100%);
            border-radius: 14px; padding: 24px 28px; color: #fff;
            display: flex; align-items: center; gap: 20px; margin-bottom: 20px;
        }
        #ceo-profile-header .avatar { font-size: 3rem; background: rgba(255,255,255,.15); border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; }
        #world-map-wrap svg { width: 100%; max-height: 220px; }
        .map-country { fill: #e2e8f0; stroke: #fff; stroke-width: 0.5; transition: fill .2s; cursor: pointer; }
        .map-country.visited { fill: #0058a3; }
        .map-country.highlight { fill: #f6ad55; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="color:#4a5568;font-size:.9rem;">CEO 뉴스 데이터 로딩 중...</div>
    </div>

    <div id="cmmContainer"></div>
    <nav class="breadcrumb">CEO 다이어리 — AI·반도체 리더 동향</nav>

    <div id="content">
        <!-- CEO 선택 카드 스크롤 -->
        <div id="ceo-selector" class="flex gap-3 overflow-x-auto pb-2 mb-5" style="scrollbar-width:thin;"></div>

        <!-- CEO 프로필 헤더 -->
        <div id="ceo-profile-header" class="hidden">
            <div class="avatar" id="profile-avatar"></div>
            <div class="flex-1">
                <div class="text-xs opacity-70 mb-1" id="profile-company"></div>
                <div class="text-2xl font-bold" id="profile-name"></div>
                <div class="text-sm opacity-80" id="profile-title"></div>
                <div class="flex gap-4 mt-3 text-xs opacity-90">
                    <span><i class="fas fa-newspaper mr-1"></i><span id="profile-news-count">0</span>건의 뉴스</span>
                    <span><i class="fas fa-globe mr-1"></i><span id="profile-country-count">0</span>개국 방문</span>
                    <span><i class="fas fa-calendar-check mr-1"></i>최근 업데이트 <span id="profile-latest-date"></span></span>
                </div>
            </div>
        </div>

        <div class="flex gap-5" style="align-items: flex-start;">
            <!-- 메인 다이어리 영역 -->
            <div class="flex-1 min-w-0">
                <!-- 검색 + 필터 -->
                <div class="flex flex-wrap items-center gap-2 mb-4">
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="diary-search" placeholder="제목·국가·활동 검색...">
                    </div>
                    <div class="flex flex-wrap gap-2" id="activity-filter-row"></div>
                    <div class="ml-auto text-xs text-gray-400" id="diary-count-label"></div>
                </div>

                <!-- 타임라인 -->
                <div id="diary-timeline"></div>
                <div id="diary-empty" class="hidden text-center py-16 text-gray-400">
                    <i class="fas fa-search text-4xl mb-3 block"></i>검색 결과가 없습니다.
                </div>
            </div>

            <!-- 사이드: 방문국 분석 + 활동 분류 -->
            <div style="width:280px;flex-shrink:0;" class="flex flex-col gap-4">
                <!-- 방문 국가 현황 -->
                <div class="bg-white rounded-xl shadow p-5">
                    <h3 class="text-sm font-semibold text-gray-700 mb-3"><i class="fas fa-map-marker-alt mr-2 text-blue-500"></i>방문 국가</h3>
                    <div id="country-stat-list"></div>
                </div>

                <!-- 활동 분류 도넛 차트 -->
                <div class="bg-white rounded-xl shadow p-5">
                    <h3 class="text-sm font-semibold text-gray-700 mb-3"><i class="fas fa-chart-pie mr-2 text-purple-500"></i>활동 유형</h3>
                    <canvas id="activity-chart" style="max-height:180px;"></canvas>
                </div>

                <!-- 연도별 활동 빈도 -->
                <div class="bg-white rounded-xl shadow p-5">
                    <h3 class="text-sm font-semibold text-gray-700 mb-3"><i class="fas fa-chart-bar mr-2 text-green-500"></i>월별 활동</h3>
                    <canvas id="monthly-chart" style="max-height:140px;"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script type="module" src="assets/js/logomodule.js"></script>
    <script type="module" src="assets/js/ceo-diary.js"></script>
</body>
</html>
