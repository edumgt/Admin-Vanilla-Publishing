<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc" style="font-family:'Segoe UI',Arial,sans-serif">
  <title id="title">Admin Vanilla Publishing Repository Architecture</title>
  <desc id="desc">Repository-level architecture showing how run_backend.sh, backend_fastapi, public assets, PostgreSQL, infra scaffolds, scripts, and DOCS fit together.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e6eef9"/>
    </linearGradient>
    <linearGradient id="primaryCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#d9e7fb"/>
    </linearGradient>
    <linearGradient id="accentCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#ffe5b5"/>
    </linearGradient>
    <linearGradient id="successCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f1"/>
      <stop offset="100%" stop-color="#d9ebde"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17324f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#58789b"/>
    </marker>
    <symbol id="icon-browser" viewBox="0 0 96 96">
      <rect x="10" y="18" width="76" height="56" rx="14" fill="#17324f"/>
      <rect x="18" y="28" width="60" height="38" rx="8" fill="#eef5ff"/>
      <circle cx="25" cy="24" r="3" fill="#8ec5ff"/>
      <circle cx="35" cy="24" r="3" fill="#8ec5ff"/>
      <circle cx="45" cy="24" r="3" fill="#8ec5ff"/>
      <path d="M38 74h20" stroke="#17324f" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-script" viewBox="0 0 96 96">
      <rect x="16" y="10" width="64" height="76" rx="14" fill="#17324f"/>
      <path d="M30 30h36M30 44h22M30 58h30" stroke="#eef5ff" stroke-width="6" stroke-linecap="round"/>
      <path d="M18 18h12" stroke="#0f62fe" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-api" viewBox="0 0 96 96">
      <rect x="12" y="12" width="72" height="72" rx="20" fill="#0f62fe"/>
      <path d="M30 36h36M30 48h24M30 60h32" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="66" cy="48" r="10" fill="none" stroke="#fff" stroke-width="5"/>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 96 96">
      <path d="M10 28c0-8 6-14 14-14h16l8 10h24c8 0 14 6 14 14v28c0 8-6 14-14 14H24c-8 0-14-6-14-14z" fill="#0f62fe"/>
      <path d="M10 34h76v34c0 8-6 14-14 14H24c-8 0-14-6-14-14z" fill="#8ec5ff"/>
    </symbol>
    <symbol id="icon-db" viewBox="0 0 96 96">
      <rect x="8" y="8" width="80" height="80" rx="22" fill="#1f8a70"/>
      <ellipse cx="48" cy="26" rx="20" ry="9" fill="#fff"/>
      <path d="M28 26v18c0 5 9 9 20 9s20-4 20-9V26" fill="#fff"/>
      <path d="M28 44v18c0 5 9 9 20 9s20-4 20-9V44" fill="#fff" opacity="0.85"/>
    </symbol>
    <symbol id="icon-docs" viewBox="0 0 96 96">
      <rect x="18" y="10" width="54" height="72" rx="10" fill="#fff"/>
      <path d="M58 10h20v20" fill="#d9e8ff"/>
      <path d="M58 10v20h20" fill="#bfd8ff"/>
      <path d="M30 36h28M30 48h32M30 60h24" stroke="#5f748a" stroke-width="5" stroke-linecap="round"/>
      <rect x="8" y="8" width="80" height="80" rx="22" fill="none" stroke="#0f62fe" stroke-width="6"/>
    </symbol>
  </defs>

  <rect width="1600" height="1020" rx="40" fill="url(#bg)"/>
  <g opacity="0.28">
    <path d="M0 130h1600M0 270h1600M0 410h1600M0 550h1600M0 690h1600M0 830h1600M0 970h1600" stroke="#c8d9eb"/>
    <path d="M170 0v1020M370 0v1020M570 0v1020M770 0v1020M970 0v1020M1170 0v1020M1370 0v1020" stroke="#c8d9eb"/>
  </g>

  <text x="86" y="84" fill="#17324f" font-size="46" font-weight="700">Repository Architecture</text>
  <text x="86" y="124" fill="#587089" font-size="22">One repo bundles the static admin UI, the FastAPI backend, deployment scaffolds, automation scripts, and captured documentation assets.</text>

  <rect x="86" y="158" width="250" height="36" rx="18" fill="#17324f"/>
  <text x="122" y="182" fill="#ffffff" font-size="16" font-weight="700">Unified Runtime at http://localhost:8000</text>

  <g filter="url(#shadow)">
    <rect x="70" y="228" width="250" height="152" rx="28" fill="#ffffff"/>
    <use href="#icon-browser" x="96" y="254" width="74" height="74"/>
    <text x="186" y="284" fill="#17324f" font-size="27" font-weight="700">Browser Users</text>
    <text x="186" y="316" fill="#5f748a" font-size="18">Open app screens and docs</text>
    <text x="186" y="342" fill="#5f748a" font-size="18">Same-origin UI plus API calls</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="388" y="212" width="270" height="184" rx="30" fill="url(#accentCard)"/>
    <use href="#icon-script" x="414" y="244" width="74" height="74"/>
    <text x="510" y="280" fill="#17324f" font-size="30" font-weight="700">run_backend.sh</text>
    <text x="512" y="314" fill="#5f748a" font-size="18">Creates .venv, installs requirements,</text>
    <text x="512" y="340" fill="#5f748a" font-size="18">starts docker-compose db, then uvicorn</text>
    <rect x="414" y="348" width="92" height="28" rx="14" fill="#17324f"/>
    <text x="435" y="367" fill="#ffffff" font-size="14" font-weight="700">.venv</text>
    <rect x="520" y="348" width="122" height="28" rx="14" fill="#0f62fe"/>
    <text x="538" y="367" fill="#ffffff" font-size="14" font-weight="700">docker compose</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="716" y="182" width="470" height="256" rx="34" fill="url(#primaryCard)"/>
    <use href="#icon-api" x="748" y="220" width="78" height="78"/>
    <text x="848" y="256" fill="#17324f" font-size="34" font-weight="700">backend_fastapi/</text>
    <text x="850" y="292" fill="#5f748a" font-size="20">FastAPI app.main is the runtime center of the repo.</text>

    <rect x="748" y="324" width="182" height="80" rx="22" fill="#ffffff"/>
    <text x="778" y="358" fill="#17324f" font-size="24" font-weight="700">Auth + JWT</text>
    <text x="778" y="384" fill="#5f748a" font-size="16">login, refresh, protected routes</text>

    <rect x="954" y="324" width="200" height="80" rx="22" fill="#ffffff"/>
    <text x="984" y="358" fill="#17324f" font-size="24" font-weight="700">Demo APIs</text>
    <text x="984" y="384" fill="#5f748a" font-size="16">menu, bookings, members, db, upload</text>

    <text x="750" y="420" fill="#17324f" font-size="18" font-weight="700">Also serves:</text>
    <text x="858" y="420" fill="#5f748a" font-size="18">static files from public/ and deployment assets from /infra</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="474" width="500" height="218" rx="34" fill="#ffffff"/>
    <use href="#icon-folder" x="100" y="514" width="78" height="78"/>
    <text x="202" y="548" fill="#17324f" font-size="34" font-weight="700">public/</text>
    <text x="204" y="584" fill="#5f748a" font-size="20">Static delivery layer for the admin demo.</text>

    <rect x="102" y="618" width="128" height="34" rx="17" fill="#17324f"/>
    <text x="132" y="640" fill="#ffffff" font-size="16" font-weight="700">HTML pages</text>
    <rect x="246" y="618" width="116" height="34" rx="17" fill="#0f62fe"/>
    <text x="279" y="640" fill="#ffffff" font-size="16" font-weight="700">assets/js</text>
    <rect x="378" y="618" width="158" height="34" rx="17" fill="#1f8a70"/>
    <text x="406" y="640" fill="#ffffff" font-size="16" font-weight="700">CSS + images</text>

    <text x="102" y="676" fill="#5f748a" font-size="18">Includes config.html, burumable.html, shared navigation, and architecture SVG assets.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1224" y="476" width="306" height="214" rx="34" fill="url(#successCard)"/>
    <use href="#icon-db" x="1252" y="516" width="78" height="78"/>
    <text x="1352" y="550" fill="#17324f" font-size="34" font-weight="700">PostgreSQL</text>
    <text x="1354" y="586" fill="#5f748a" font-size="18">Container from</text>
    <text x="1354" y="612" fill="#5f748a" font-size="18">backend_fastapi/docker-compose.yml</text>
    <text x="1354" y="646" fill="#5f748a" font-size="18">health-gated before FastAPI startup</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="752" width="448" height="188" rx="32" fill="#ffffff"/>
    <use href="#icon-script" x="98" y="790" width="74" height="74"/>
    <text x="194" y="824" fill="#17324f" font-size="32" font-weight="700">scripts/</text>
    <text x="196" y="858" fill="#5f748a" font-size="18">AWS bootstrap scripts, frontend sync,</text>
    <text x="196" y="884" fill="#5f748a" font-size="18">and Playwright-based capture-screens.js</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="566" y="734" width="470" height="222" rx="34" fill="url(#primaryCard)"/>
    <use href="#icon-folder" x="596" y="774" width="76" height="76"/>
    <text x="696" y="808" fill="#17324f" font-size="34" font-weight="700">infra/</text>
    <text x="698" y="844" fill="#5f748a" font-size="20">Deployment scaffolds kept beside the app source.</text>

    <rect x="598" y="880" width="88" height="32" rx="16" fill="#17324f"/>
    <text x="625" y="901" fill="#ffffff" font-size="15" font-weight="700">aws/</text>
    <rect x="706" y="880" width="104" height="32" rx="16" fill="#0f62fe"/>
    <text x="730" y="901" fill="#ffffff" font-size="15" font-weight="700">docker/</text>
    <rect x="830" y="880" width="84" height="32" rx="16" fill="#1f8a70"/>
    <text x="855" y="901" fill="#ffffff" font-size="15" font-weight="700">k8s/</text>
    <rect x="930" y="880" width="84" height="32" rx="16" fill="#f59e0b"/>
    <text x="944" y="901" fill="#ffffff" font-size="15" font-weight="700">profile</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1084" y="758" width="446" height="182" rx="32" fill="#ffffff"/>
    <use href="#icon-docs" x="1110" y="794" width="74" height="74"/>
    <text x="1206" y="828" fill="#17324f" font-size="32" font-weight="700">DOCS/</text>
    <text x="1208" y="862" fill="#5f748a" font-size="18">Captured UI screenshots used by README.</text>
    <text x="1208" y="888" fill="#5f748a" font-size="18">Includes PaaS setup screens and Blue Marble demo.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1224" y="194" width="308" height="176" rx="30" fill="none" stroke="#b7cbe2" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="1260" y="248" fill="#17324f" font-size="30" font-weight="700">backend/</text>
    <text x="1260" y="286" fill="#5f748a" font-size="18">Legacy reference implementation.</text>
    <text x="1260" y="312" fill="#5f748a" font-size="18">Kept for comparison, not the main edit target.</text>
  </g>

  <path d="M320 304H388" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M658 304H716" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M716 380H570V584" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1186 380H1284V476" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M320 280C430 210 610 178 716 214" fill="none" stroke="#7a95b5" stroke-width="4" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <path d="M518 846H566" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1036 846H1084" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M800 734V438" fill="none" stroke="#7a95b5" stroke-width="4" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <path d="M1224 846C1148 846 1090 846 1036 846" fill="none" stroke="#7a95b5" stroke-width="4" stroke-dasharray="12 12"/>

  <text x="604" y="472" fill="#17324f" font-size="18" font-weight="700">FastAPI serves the public/ directory and exposes APIs on the same origin.</text>
</svg>
