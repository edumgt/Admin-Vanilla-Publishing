<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">On Prem Docker Compose Architecture</title>
  <desc id="desc">Admin Vanilla Publishing on prem Docker Compose architecture with Nginx, FastAPI and PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e5f0fb"/>
    </linearGradient>
    <linearGradient id="dockerCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#d8eafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#17324f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#537190"/>
    </marker>
  </defs>
  <rect width="1400" height="860" rx="36" fill="url(#bg)"/>
  <text x="72" y="82" fill="#14263b" font-size="38" font-weight="700">On Prem / Docker Compose</text>
  <text x="72" y="118" fill="#5f748a" font-size="18">Nginx frontend, FastAPI backend, PostgreSQL database, `.env` driven local platform stack</text>

  <g filter="url(#shadow)">
    <rect x="90" y="182" width="232" height="130" rx="28" fill="#ffffff"/>
    <text x="122" y="222" fill="#14263b" font-size="28" font-weight="700">업무 사용자</text>
    <text x="122" y="256" fill="#5f748a" font-size="18">Browser / LAN / VPN</text>
    <text x="122" y="284" fill="#5f748a" font-size="18">`config.html`, `burumable.html`</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="158" width="300" height="162" rx="30" fill="url(#dockerCard)"/>
    <rect x="444" y="194" width="76" height="76" rx="22" fill="#0ea5e9"/>
    <text x="540" y="222" fill="#14263b" font-size="28" font-weight="700">Frontend Container</text>
    <text x="540" y="254" fill="#5f748a" font-size="18">Nginx static hosting</text>
    <text x="540" y="282" fill="#5f748a" font-size="18">Proxies `/api`, `/auth`, `/infra`</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="784" y="158" width="300" height="162" rx="30" fill="url(#dockerCard)"/>
    <rect x="818" y="194" width="76" height="76" rx="22" fill="#2563eb"/>
    <text x="914" y="222" fill="#14263b" font-size="28" font-weight="700">Backend Container</text>
    <text x="914" y="254" fill="#5f748a" font-size="18">FastAPI + Uvicorn</text>
    <text x="914" y="282" fill="#5f748a" font-size="18">Serves API and `/infra/*` artifacts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1096" y="376" width="220" height="148" rx="30" fill="#ffffff"/>
    <rect x="1126" y="406" width="60" height="60" rx="20" fill="#17324f"/>
    <path d="M1126 434c0-10 13-18 30-18s30 8 30 18m-60 0v16c0 10 13 18 30 18s30-8 30-18v-16" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="1202" y="430" fill="#14263b" font-size="24" font-weight="700">PostgreSQL</text>
    <text x="1202" y="460" fill="#5f748a" font-size="16">Persistent data volume</text>
    <text x="1202" y="484" fill="#5f748a" font-size="16">Healthcheck gated startup</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="164" y="420" width="920" height="262" rx="34" fill="#ffffff"/>
    <text x="202" y="468" fill="#14263b" font-size="30" font-weight="700">Compose Bootstrap Surface</text>
    <text x="202" y="500" fill="#5f748a" font-size="18">이 경로는 `infra/docker/.env.example` 과 `infra/docker/docker-compose.onprem.yml` 기준으로 기동합니다.</text>
    <rect x="202" y="544" width="260" height="96" rx="24" fill="#edf7ff"/>
    <text x="228" y="582" fill="#14263b" font-size="22" font-weight="700">.env</text>
    <text x="228" y="612" fill="#5f748a" font-size="16">ports / DB / JWT / CORS</text>
    <rect x="494" y="544" width="260" height="96" rx="24" fill="#edf7ff"/>
    <text x="520" y="582" fill="#14263b" font-size="22" font-weight="700">docker compose</text>
    <text x="520" y="612" fill="#5f748a" font-size="16">db + backend + frontend</text>
    <rect x="786" y="544" width="260" height="96" rx="24" fill="#edf7ff"/>
    <text x="812" y="582" fill="#14263b" font-size="22" font-weight="700">nginx/default.conf</text>
    <text x="812" y="612" fill="#5f748a" font-size="16">reverse proxy / SPA fallback</text>
  </g>

  <path d="M322 246H410" fill="none" stroke="#537190" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M710 239h74" fill="none" stroke="#537190" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M934 320v56" fill="none" stroke="#537190" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1084 450h12" fill="none" stroke="#537190" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M560 420V320" fill="none" stroke="#6c8aa8" stroke-width="4" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <path d="M830 420V320" fill="none" stroke="#6c8aa8" stroke-width="4" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
</svg>
