<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc" style="font-family:'Segoe UI',Arial,sans-serif">
  <title id="title">On Prem Docker Compose Architecture</title>
  <desc id="desc">Admin Vanilla Publishing on premises deployment using Docker Compose, Nginx, FastAPI, and PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e3eef9"/>
    </linearGradient>
    <linearGradient id="stackCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#d7e8fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17324f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#58789b"/>
    </marker>

    <symbol id="icon-user" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="40" fill="#17324f"/>
      <path d="M26 58c6-10 14-15 22-15s16 5 22 15" fill="none" stroke="#e8f0fb" stroke-width="6" stroke-linecap="round"/>
      <circle cx="48" cy="36" r="12" fill="#e8f0fb"/>
    </symbol>
    <symbol id="icon-frontend" viewBox="0 0 96 96">
      <rect x="10" y="16" width="76" height="56" rx="14" fill="#0ea5e9"/>
      <rect x="20" y="26" width="56" height="36" rx="8" fill="#ffffff" opacity="0.88"/>
      <rect x="30" y="74" width="36" height="8" rx="4" fill="#0ea5e9"/>
    </symbol>
    <symbol id="icon-backend" viewBox="0 0 96 96">
      <rect x="18" y="18" width="60" height="60" rx="16" fill="#2563eb"/>
      <path d="M34 34h28M34 48h28M34 62h18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-db" viewBox="0 0 96 96">
      <rect x="8" y="8" width="80" height="80" rx="22" fill="#17324f"/>
      <ellipse cx="48" cy="26" rx="20" ry="9" fill="#fff"/>
      <path d="M28 26v18c0 5 9 9 20 9s20-4 20-9V26" fill="#fff"/>
      <path d="M28 44v18c0 5 9 9 20 9s20-4 20-9V44" fill="#fff" opacity="0.85"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 96 96">
      <rect x="18" y="12" width="54" height="72" rx="10" fill="#fff"/>
      <path d="M58 12h20v20" fill="#d9e8ff"/>
      <path d="M58 12v20h20" fill="#bfd8ff"/>
      <path d="M30 38h28M30 50h32M30 62h24" fill="none" stroke="#5f748a" stroke-width="5" stroke-linecap="round"/>
      <rect x="8" y="8" width="80" height="80" rx="22" fill="none" stroke="#0f62fe" stroke-width="6"/>
    </symbol>
  </defs>

  <rect width="1600" height="960" rx="40" fill="url(#bg)"/>
  <g opacity="0.34">
    <path d="M0 118h1600M0 258h1600M0 398h1600M0 538h1600M0 678h1600M0 818h1600" stroke="#c8d9eb"/>
    <path d="M180 0v960M380 0v960M580 0v960M780 0v960M980 0v960M1180 0v960M1380 0v960" stroke="#c8d9eb"/>
  </g>

  <text x="86" y="82" fill="#17324f" font-size="46" font-weight="700">On Prem / Docker Compose</text>
  <text x="86" y="122" fill="#587089" font-size="22">Single-host bootstrap with an Nginx frontend container, a FastAPI backend container, and a PostgreSQL database.</text>

  <rect x="86" y="156" width="180" height="34" rx="17" fill="#17324f"/>
  <text x="120" y="179" fill="#ffffff" font-size="16" font-weight="700">Runtime Path</text>

  <g filter="url(#shadow)">
    <rect x="86" y="220" width="246" height="154" rx="28" fill="#ffffff"/>
    <use href="#icon-user" x="112" y="246" width="72" height="72"/>
    <text x="194" y="276" fill="#17324f" font-size="27" font-weight="700">Business Users</text>
    <text x="198" y="308" fill="#5f748a" font-size="18">Browser access on LAN or VPN</text>
    <text x="198" y="334" fill="#5f748a" font-size="18">Opens config.html and app screens</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="184" width="344" height="168" rx="30" fill="url(#stackCard)"/>
    <use href="#icon-frontend" x="418" y="222" width="76" height="76"/>
    <text x="518" y="250" fill="#17324f" font-size="29" font-weight="700">Frontend Container</text>
    <text x="520" y="286" fill="#5f748a" font-size="19">Nginx serves static files from public/</text>
    <text x="520" y="314" fill="#5f748a" font-size="19">Reverse proxies API and infra routes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="184" width="344" height="168" rx="30" fill="url(#stackCard)"/>
    <use href="#icon-backend" x="818" y="222" width="76" height="76"/>
    <text x="918" y="250" fill="#17324f" font-size="29" font-weight="700">Backend Container</text>
    <text x="920" y="286" fill="#5f748a" font-size="19">FastAPI + Uvicorn application process</text>
    <text x="920" y="314" fill="#5f748a" font-size="19">Reads env, serves APIs, waits for DB ready</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="220" width="284" height="154" rx="30" fill="#ffffff"/>
    <use href="#icon-db" x="1218" y="246" width="76" height="76"/>
    <text x="1316" y="278" fill="#17324f" font-size="28" font-weight="700">PostgreSQL</text>
    <text x="1318" y="308" fill="#5f748a" font-size="18">Persistent service volume</text>
    <text x="1318" y="334" fill="#5f748a" font-size="18">Healthcheck gates backend startup</text>
  </g>

  <rect x="86" y="454" width="212" height="34" rx="17" fill="#0f62fe"/>
  <text x="116" y="477" fill="#ffffff" font-size="16" font-weight="700">Bootstrap Surface</text>

  <g filter="url(#shadow)">
    <rect x="86" y="514" width="1388" height="284" rx="36" fill="#ffffff"/>
    <text x="126" y="570" fill="#17324f" font-size="36" font-weight="700">Compose Bootstrap Files</text>
    <text x="126" y="606" fill="#5f748a" font-size="20">Local deployment is driven by infra/docker/.env.example, docker-compose.onprem.yml, and nginx/default.conf.</text>

    <rect x="126" y="654" width="320" height="108" rx="26" fill="url(#stackCard)"/>
    <use href="#icon-file" x="146" y="676" width="60" height="60"/>
    <text x="222" y="694" fill="#17324f" font-size="28" font-weight="700">.env</text>
    <text x="222" y="724" fill="#5f748a" font-size="17">Ports, DB URL, JWT, CORS, feature flags</text>

    <rect x="488" y="654" width="420" height="108" rx="26" fill="url(#stackCard)"/>
    <use href="#icon-file" x="508" y="676" width="60" height="60"/>
    <text x="584" y="694" fill="#17324f" font-size="28" font-weight="700">docker-compose.onprem.yml</text>
    <text x="584" y="724" fill="#5f748a" font-size="17">Defines db, backend, frontend, networking, and healthchecks</text>

    <rect x="950" y="654" width="484" height="108" rx="26" fill="url(#stackCard)"/>
    <use href="#icon-file" x="970" y="676" width="60" height="60"/>
    <text x="1046" y="694" fill="#17324f" font-size="28" font-weight="700">nginx/default.conf</text>
    <text x="1046" y="724" fill="#5f748a" font-size="17">SPA fallback, proxy routes, and static file handling</text>
  </g>

  <path d="M332 297H390" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M734 268h56" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1134 297h56" fill="none" stroke="#58789b" stroke-width="6" marker-end="url(#arrow)"/>

  <path d="M562 514V352" fill="none" stroke="#7a95b5" stroke-width="4" stroke-dasharray="12 12"/>
  <path d="M962 514V352" fill="none" stroke="#7a95b5" stroke-width="4" stroke-dasharray="12 12"/>
</svg>
