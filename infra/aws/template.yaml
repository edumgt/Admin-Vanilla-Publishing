AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Admin Vanilla Publishing serverless scaffold

Parameters:
  ProjectName:
    Type: String
    Default: admin-vanilla
  StageName:
    Type: String
    Default: prod
  AllowedOrigin:
    Type: String
    Default: https://app.example.com
  FrontendBucketName:
    Type: String
    Default: admin-vanilla-frontend-prod
  DatabaseUrl:
    Type: String
    Default: sqlite:////tmp/admin-vanilla.db
  LambdaMemorySize:
    Type: Number
    Default: 1024
  LambdaTimeout:
    Type: Number
    Default: 30

Globals:
  Function:
    Runtime: python3.12
    MemorySize: !Ref LambdaMemorySize
    Timeout: !Ref LambdaTimeout

Resources:
  BackendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        AllowCredentials: true

  BackendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          CORS_ALLOW_ORIGINS: !Ref AllowedOrigin
          JWT_SECRET_KEY: replace-with-server-side-secret
          DEMO_AUTH_ENABLED: "true"
      Events:
        ApiRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /api/{proxy+}
            Method: ANY
        DbRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /db/{proxy+}
            Method: ANY
        AuthRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /auth/{proxy+}
            Method: ANY
        UploadRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /upload/{proxy+}
            Method: ANY
        LoginRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /login
            Method: POST
        ProtectedRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /protected
            Method: GET
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /health
            Method: GET
        HealthSubRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /health/{proxy+}
            Method: ANY
        InfraRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /infra/{proxy+}
            Method: GET

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: frontend-s3-origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          TargetOriginId: frontend-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  FrontendBucketOutput:
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  CloudFrontDomain:
    Value: !GetAtt FrontendDistribution.DomainName
