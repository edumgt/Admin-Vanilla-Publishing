apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-vanilla-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-vanilla-backend
  template:
    metadata:
      labels:
        app: admin-vanilla-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/admin-vanilla-backend:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: admin-vanilla-config
                  key: APP_ENV
            - name: CORS_ALLOW_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: admin-vanilla-config
                  key: CORS_ALLOW_ORIGINS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: admin-vanilla-secret
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-vanilla-secret
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: admin-vanilla-backend
spec:
  selector:
    app: admin-vanilla-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
