services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newhomepage}
      POSTGRES_USER: ${POSTGRES_USER:-newhomepage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newhomepage} -d ${POSTGRES_DB:-newhomepage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /workspace/backend_fastapi
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-newhomepage}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-newhomepage}
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-long-secret}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
    volumes:
      - ../../backend_fastapi:/workspace/backend_fastapi:ro
      - ../../public:/workspace/public:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ../../public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
